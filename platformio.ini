[platformio]
default_envs = cores3_dual
src_dir = central/cores3

[env:cores3_dual]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"0.2.0-dual\"
