name: Export ARM build inputs

on:
  push:
    branches: [v0.4.0-legacy8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download exact xPack ARM GCC
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.2.1-1.1/xpack-arm-none-eabi-gcc-13.2.1-1.1-linux-x64.tar.gz"
          curl -L --fail --retry 3 -o arm-gcc.tar.gz "$url"
          echo "1252a8cafe9237de27a765376697230368eec21db44dc3f1edeb8d838dabd530  arm-gcc.tar.gz" | sha256sum -c -
      - name: Pack repository source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf repo-source.tar.gz             README.md platformio.ini             config include scripts tests type2dk type2bp central web docs             .github/workflows/build.yml
      - uses: actions/upload-artifact@v4
        with:
          name: v040-local-build-inputs
          path: |
            arm-gcc.tar.gz
            repo-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
